spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:studymate;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  session:
    store-type: none
  sql:
    init:
      mode: always
  task:
    scheduling:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
